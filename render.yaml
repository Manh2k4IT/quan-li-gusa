services:
  - type: web
    name: gusa
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && DATABASE_URL=file:./build.db npx prisma migrate deploy && DATABASE_URL=file:./build.db npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    disk:
      name: gusa-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: "file:/var/data/dev.db"
